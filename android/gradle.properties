# Project-wide Gradle settings for AI Toolkit

# Android SDK versions (API 36 - Android 16)
AIToolkit_compileSdkVersion=36
# 26, not React Native's floor of 24: ML Kit GenAI declares minSdk 26, so 24
# fails the manifest merge, and genai-speech-recognition is 26+ as well. There
# is no version of this library that works on API 24-25.
AIToolkit_minSdkVersion=26
AIToolkit_targetSdkVersion=36

# Kotlin version. Only a fallback — build.gradle prefers the host app's
# rootProject.ext.kotlinVersion when it sets one. It must not trail the Kotlin
# the app resolves: at 2.1.20 the library compiled against a 2.1.0 metadata
# version while kotlin-stdlib and ML Kit GenAI shipped 2.3.0, and every one of
# them failed with "Module was compiled with an incompatible version of Kotlin".
AIToolkit_kotlinVersion=2.3.21

# Enable AndroidX
android.useAndroidX=true

# Jetifier is only for pre-AndroidX dependencies; none are used here.
android.enableJetifier=false

# New Architecture settings
newArchEnabled=true

# Increase memory for builds
org.gradle.jvmargs=-Xmx2048m

# Enable parallel builds
org.gradle.parallel=true

# Enable caching
org.gradle.caching=true