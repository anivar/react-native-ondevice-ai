# Project-wide Gradle settings for AI Toolkit

# Android SDK versions (API 36 - Android 16)
AIToolkit_compileSdkVersion=36
# 26, not React Native's floor of 24: ML Kit GenAI declares minSdk 26, so 24
# fails the manifest merge, and genai-speech-recognition is 26+ as well. There
# is no version of this library that works on API 24-25.
AIToolkit_minSdkVersion=26
AIToolkit_targetSdkVersion=36

# Kotlin version. Only a fallback for standalone evaluation of this module —
# build.gradle prefers the host app's rootProject.ext.kotlinVersion, and in a
# real app React Native's own Gradle plugin decides the compiler regardless.
# Keep it aligned with what React Native ships (0.86 -> 2.1.20) rather than
# ahead of it: raising it here does not raise the app's compiler, it only
# forces a newer stdlib into a build that cannot read it.
AIToolkit_kotlinVersion=2.1.20

# Enable AndroidX
android.useAndroidX=true

# Jetifier is only for pre-AndroidX dependencies; none are used here.
android.enableJetifier=false

# New Architecture settings
newArchEnabled=true

# Increase memory for builds
org.gradle.jvmargs=-Xmx2048m

# Enable parallel builds
org.gradle.parallel=true

# Enable caching
org.gradle.caching=true