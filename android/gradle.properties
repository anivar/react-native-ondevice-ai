# Project-wide Gradle settings for AI Toolkit

# Android SDK versions (API 36 - Android 16)
AIToolkit_compileSdkVersion=36
AIToolkit_minSdkVersion=24
AIToolkit_targetSdkVersion=36

# Kotlin version
AIToolkit_kotlinVersion=2.0.21

# Enable AndroidX
android.useAndroidX=true

# Jetifier is only for pre-AndroidX dependencies; none are used here.
android.enableJetifier=false

# New Architecture settings
newArchEnabled=true

# Increase memory for builds
org.gradle.jvmargs=-Xmx2048m

# Enable parallel builds
org.gradle.parallel=true

# Enable caching
org.gradle.caching=true