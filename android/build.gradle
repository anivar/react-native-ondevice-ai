buildscript {
  // Buildscript is evaluated before everything else so we can't use getExtOrDefault
  def kotlin_version = rootProject.ext.has('kotlinVersion') ? rootProject.ext.get('kotlinVersion') : project.properties['AIToolkit_kotlinVersion']

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath 'com.android.tools.build:gradle:8.12.0'
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
  }
}

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

if (isNewArchitectureEnabled()) {
  apply plugin: 'com.facebook.react'
}

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["AIToolkit_" + name]
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["AIToolkit_" + name]).toInteger()
}

def supportsNamespace() {
  def parsed = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')
  def major = parsed[0].toInteger()
  def minor = parsed[1].toInteger()

  // Namespace support was added in 7.3.0
  return (major == 7 && minor >= 3) || major >= 8
}

android {
  if (supportsNamespace()) {
    namespace "com.anivar.ondeviceai"
  }

  compileSdk getExtOrIntegerDefault('compileSdkVersion')

  defaultConfig {
    minSdk getExtOrIntegerDefault('minSdkVersion')
    targetSdk getExtOrIntegerDefault('targetSdkVersion')

  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  // `lintOptions` was removed in AGP 8.
  lint {
    disable 'GradleCompatible'
  }

  // 17, not 1.8: React Native 0.80 and AGP 8 both require a JDK 17 toolchain,
  // and AGP 8 rejects 1.8 source compatibility outright.
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }

  sourceSets {
    main {
      if (isNewArchitectureEnabled()) {
        java.srcDirs += [
          "src/newarch",
          // This is needed to build Kotlin classes before Java classes
          "src/main/java"
        ]
      } else {
        java.srcDirs += [
          "src/oldarch",
          // This is needed to build Kotlin classes before Java classes
          "src/main/java"
        ]
      }
    }
  }
}

repositories {
  mavenCentral()
  google()

  def found = false
  def defaultDir = null
  def androidSourcesName = 'React Native sources'

  if (rootProject.ext.has('reactNativeAndroidRoot')) {
    defaultDir = rootProject.ext.get('reactNativeAndroidRoot')
  } else {
    defaultDir = new File(
      projectDir,
      '/../../../node_modules/react-native/android'
    )
  }

  if (defaultDir.exists()) {
    maven {
      url defaultDir.toString()
      name androidSourcesName
    }

    logger.info(":${project.name}:reactNativeAndroidRoot ${defaultDir.canonicalPath}")
    found = true
  } else {
    def parentDir = rootProject.projectDir

    1.upto(5, {
      if (found) return true
      parentDir = parentDir.parentFile

      def androidSourcesDir = new File(
        parentDir,
        'node_modules/react-native'
      )

      def androidPrebuiltBinaryDir = new File(
        parentDir,
        'node_modules/react-native/android'
      )

      if (androidPrebuiltBinaryDir.exists()) {
        maven {
          url androidPrebuiltBinaryDir.toString()
          name androidSourcesName
        }

        logger.info(":${project.name}:reactNativeAndroidRoot ${androidPrebuiltBinaryDir.canonicalPath}")
        found = true
      } else if (androidSourcesDir.exists()) {
        maven {
          url androidSourcesDir.toString()
          name androidSourcesName
        }

        logger.info(":${project.name}:reactNativeAndroidRoot ${androidSourcesDir.canonicalPath}")
        found = true
      }
    })
  }

  if (!found) {
    throw new GradleException(
      "${project.name}: unable to locate React Native android sources. " +
        "Ensure you have you installed React Native as a dependency in your project and try again."
    )
  }
}

dependencies {
  // For < 0.71, this will be from the local maven repo
  // For > 0.71, this will be replaced by `com.facebook.react:react-android:$version` by react gradle plugin
  //noinspection GradleDynamicVersion
  implementation 'com.facebook.react:react-native:+'

  // No explicit kotlin-stdlib. The Kotlin plugin adds the stdlib matching the
  // compiler the *app* resolves; naming a version here forced that version on
  // the whole app instead, and a stdlib newer than the app's compiler breaks
  // every other library in the build — react-native-safe-area-context first.

  // The GenAI Prompt API is suspend-based, so the module needs a scope to call
  // it from. Present transitively through genai-common, but named explicitly
  // because the code depends on it directly.
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'

  // ListenableFuture.await(). The four Task-shaped GenAI features are not
  // Task-shaped at all — checkFeatureStatus(), prepareInferenceEngine() and
  // runInference() all return Guava ListenableFuture, which has no
  // addOnSuccessListener. This adds the suspend bridge without pulling in the
  // whole of Guava, which kotlinx-coroutines-guava would.
  implementation 'androidx.concurrent:concurrent-futures-ktx:1.2.0'

  // ML Kit base APIs (GA, work on all devices)
  implementation 'com.google.mlkit:text-recognition:16.0.1'
  implementation 'com.google.mlkit:object-detection:17.0.2'
  implementation 'com.google.mlkit:face-detection:16.1.7'
  implementation 'com.google.mlkit:language-id:17.0.6'
  implementation 'com.google.mlkit:translate:17.0.3'
  implementation 'com.google.mlkit:smart-reply:17.0.4'
  implementation 'com.google.mlkit:entity-extraction:16.0.0-beta6'
  implementation 'com.google.mlkit:barcode-scanning:17.3.0'
  implementation 'com.google.mlkit:image-labeling:17.0.9'
  implementation 'com.google.mlkit:segmentation-selfie:16.0.0-beta6'

  // ML Kit GenAI APIs (Beta). These need AICore, which serves Gemini Nano —
  // not Gemma, which is a separate self-hosted model for MediaPipe/LiteRT.
  // The four feature APIs below and the Prompt API do not cover the same
  // devices: the Galaxy S25 family supports these four and not the Prompt API.
  // Methods that depend on these reject FEATURE_UNAVAILABLE on unsupported devices.
  implementation 'com.google.mlkit:genai-summarization:1.0.0-beta1'
  implementation 'com.google.mlkit:genai-rewriting:1.0.0-beta1'
  implementation 'com.google.mlkit:genai-proofreading:1.0.0-beta1'
  implementation 'com.google.mlkit:genai-image-description:1.0.0-beta1'
  // beta2, not beta4, and this is a hard constraint rather than caution.
  //
  // beta3 and beta4 are compiled with Kotlin 2.3 and beta4 additionally pulls
  // genai-schema:1.0.0-alpha1, also 2.3. React Native 0.86 compiles with Kotlin
  // 2.1.20, which reads metadata up to 2.2.0, so every class in those artifacts
  // fails with "Module was compiled with an incompatible version of Kotlin" and
  // the consuming app does not build. Raising the app's Kotlin is not a fix
  // available to a library: React Native's Gradle plugin resolves the compiler
  // version itself, and setting ext.kotlinVersion in the app changed nothing.
  //
  // beta2 carries metadata 2.2.0 and depends on genai-common:1.0.0-beta3, also
  // 2.2.0. The other four genai artifacts pull genai-common:1.0.0-beta1, so the
  // build resolves beta3 for all of them and stays readable.
  //
  // Revisit when React Native ships Kotlin 2.3.
  implementation 'com.google.mlkit:genai-prompt:1.0.0-beta2'
}